/fusion_box_node:
  ros__parameters:
    # 基础配置  821
    lidar_frame: "hesai_lidar"
    camera_frame: "camera_optical_frame"
    
    # 滑动窗口的相关参数
    lidar_window_size: 10
    camera_window_size: 10
    max_sync_diff: 0.5   # 最大允许的时间差（秒）
    
    # 交并比的阈值
    overlap_threshold: 0.01
        
    # ==========================================
    # 1. 图像内参（基于内外参.txt中的MATLAB标定结果）
    # ==========================================
    image_width: 1280
    image_height: 720
    
    camera_matrix:
      fx: 524.5870
      fy: 524.2155
      cx: 620.3909
      cy: 344.0833
    
    # ==========================================
    # 2. 畸变系数（顺序: k1, k2, p1, p2, k3）
    #    仅径向畸变，切向为0，k3未估计设为0
    # ==========================================
    dist_coeffs: [
      -0.0074, 
       0.0045, 
       0.0000, 
       0.0000, 
       0.0000
    ]
    
    # ==========================================
    # 3. 外参矩阵 (LiDAR -> Camera) 行优先 4×4
    #    来自内外参.txt中的齐次变换矩阵 A
    # ==========================================
    lidar_to_camera_matrix: [
       0.0239, -0.9997, -0.0021,  0.0372,
       0.0952,  0.0043, -0.9954,  0.0084,
       0.9952,  0.0236,  0.0953, -0.0319,
       0.0,     0.0,     0.0,     1.0000
    ]
