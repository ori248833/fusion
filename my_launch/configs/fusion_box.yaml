/fusion_box_node:
  ros__parameters:
    # ========== 坐标系与时间配对 ==========
    # LiDAR frame 名称，用于融合结果和可视化的坐标语义。
    lidar_frame: "hesai_lidar"
    # LiDAR 与 Camera 原始采集时间戳的最大差值，单位秒。上色与深度补位共用。
    # 它只判断是否属于同一观测时刻，不能用来容忍 YOLO 推理延迟。
    max_sync_diff: 0.10

    # 相机结果先到而对应 LiDAR 检测尚未发布时，最多等待 0.30 秒。
    # 等待使用单调墙钟；实际配对仍只比较两路原始采集时间戳。
    camera_pending_wait_sec: 0.30
    camera_pending_max_frames: 12
    # 多帧相机在同一 LiDAR 到达后被释放时，融合线程按时间顺序处理。
    fusion_queue_max_tasks: 12

    # ========== 相机晚到补色与内部 Track ==========
    # 保存历史 LiDAR 帧的时间长度，单位秒；Camera 晚到时在此缓存中找对应雷达帧。
    lidar_history_duration: 0.60
    # bag 回放设为 false，只按两路 header.stamp 配对；真车设为 true。
    enable_camera_age_gate: false
    # Camera 结果允许晚到的硬上限，单位秒；超过后不再更新颜色。
    max_camera_result_age: 0.50
    # 超过此年龄仍会处理，但会进入 Health 日志的高延迟统计。
    camera_age_warn_threshold: 0.40
    # 当前 LiDAR 锥桶与已有 Track 的最大二维关联距离。
    # 单位必须与 lidar center.x/y 一致；当前默认按米设计。
    track_match_distance: 1.50
    # Track 多久没有新 LiDAR 关联后删除，单位秒。
    track_timeout: 1.00
    # 新颜色与已有颜色冲突时，连续多少次相同观测后才覆盖旧颜色。
    color_conflict_confirmations: 2

    # ========== ZED 近距离锥桶补位（改后重启） ==========
    depth_fallback:
      # off: 不启动深度补位；preview: 仅发布候选；map: 将合格候选补入 Map。
      mode: "off"
      # ZED 驱动单独启动。preview/map 需要启用深度图并保留采集时间戳。
      # 若也要关闭驱动里的深度计算，在 ZED 驱动配置中将 depth_mode 设为 NONE。
      depth_topic: "/zed/zed_node/depth/depth_registered"
      # LiDAR 原点前方的平面半径，单位米。
      max_range_m: 4.0
      # YOLO 与深度严格同帧，深度候选与 LiDAR 配对使用上面的 max_sync_diff。
      # 候选缓存的有效期。启用 enable_camera_age_gate 时也检查采集时间。
      max_age_sec: 0.15
      # 已有 LiDAR 锥桶附近的相机候选视为重复，单位米。
      duplicate_distance_m: 0.40
      min_yolo_confidence: 0.50

    # ========== 融合可视化与健康日志 ==========
    # 2D 合成调试图总开关；false 时不构造可视化数据，不影响 Map 输出。
    enable_visualization: false
    # 可视化开启时，每 N 个有效 Camera 融合任务生成一次调试图。
    visualization_every_n: 5
    # Health 汇总日志周期，单位秒；包含帧率、超时、同步差、耗时和着色率。
    health_log_interval: 5.0

    # ========== 连续融合展示图 ==========
    # false 时完全不订阅原始点云、不创建展示图线程，实车比赛保持 false。
    # true 时每个满足条件的融合帧都保存一张 PNG，直到节点停止。
    enable_showcase_capture: false
    showcase_pointcloud_topic: "/lidar_points"
    showcase_output_directory: "/home/dian/DRd26_ws/showcase"
    showcase_image_width: 1920
    showcase_image_height: 1080
    # 设为 1：本帧只要至少有一个真实 LiDAR↔YOLO 匹配就保存。
    showcase_min_fused_cones: 1
    # 原始点云与用于融合的 LiDAR 检测帧最大时间差，单位秒。
    showcase_max_sync_diff: 0.03
    showcase_cloud_history_duration: 0.80
    # 仅影响展示图片；2 表示每两个环境点绘制一个，降低渲染时间。
    showcase_point_stride: 2
    # 展示图使用的 LiDAR 坐标范围，单位米（x 前向、y 横向、z 高度）。
    showcase_forward_min: -5.0
    showcase_forward_max: 35.0
    showcase_lateral_limit: 15.0
    showcase_height_min: -3.0
    showcase_height_max: 5.0

    # ========== CSV 融合调试 ==========
    # 同时启用逐帧匹配调试 CSV 和消息回放 CSV。
    enable_visual_csv: true
    # 每次启动会新建运行文件夹；每帧子目录含 fusion.csv 和 cones.csv。
    visual_csv_output_directory: "/home/dian/DRd26_ws/src/my_launch/fusion_debug"
    # 每 N 个成功匹配的调试帧保存一次；1 表示全部保存。
    visual_csv_every_n: 1
    # 逐帧匹配调试的帧数上限；0 表示不限制。replay.csv 连续记录。
    visual_csv_max_frames: 1000
    # true 时，每帧 cones.csv 同时保留未知颜色锥桶。
    visual_csv_include_unknown: true
    # 两种 CSV 分别限制待写记录数；队列满时丢弃对应记录。
    visual_csv_queue_size: 1024
    
    # ========== 空间匹配阈值 ==========
    # 通过几何门控后，LiDAR 投影框与 YOLO 框的 IoU 必须大于该值才匹配。
    overlap_threshold: 0.05
        
    # ==========================================
    # 相机模型与 LiDAR→Camera 标定（基于内外参822.txt）
    # ==========================================
    # 图像宽高必须与 image_topic 实际图像流一致。
    image_width: 1280
    image_height: 720
    
    # K 矩阵：fx/fy 为像素焦距，cx/cy 为像素主点。
    camera_matrix:
      fx: 532.4088   # 更新标定参数
      fy: 532.8013   # 更新标定参数
      cx: 620.6579   # 更新标定参数
      cy: 345.9719   # 更新标定参数
    
    # ==========================================
    # 畸变系数，顺序 k1, k2, p1, p2, k3。
    # 当前投影使用 rectified 图像和针孔模型；参数保留用于标定一致性。
    # ==========================================
    dist_coeffs: [
       0.0055,       # 更新 k1
       -0.00019978, # 更新 k2
       0.0000,
       0.0000,
       0.0000
    ]
    
    # ==========================================
    # LiDAR→Camera 的 4×4 齐次变换矩阵，行优先展开为 16 个数。
    # 必须与上述内参、图像流和实际安装位姿属于同一套标定结果。
    # ==========================================
    lidar_to_camera_matrix: [
      -0.0082, -1.0000, -0.0004,  0.0467,   # 更新第一行
      -0.0018,  0.0004, -1.0000,  0.0622,   # 更新第二行
       1.0000, -0.0082, -0.0018,  0.0339,   # 更新第三行
       0.0,     0.0,     0.0,     1.0000
    ]
